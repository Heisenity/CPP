name: Autopublish

on:
  workflow_dispatch:        # <-- enables the "Run workflow" button
  schedule:
    - cron: "30 21 * * *"   # runs nightly ~03:00 IST

name: Nightly Content Upgrade

on:
  schedule:
    - cron: "30 21 * * *" # Runs at 03:00 IST (21:30 UTC)
  workflow_dispatch: # Allows manual triggering

jobs:
  upgrade-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run content upgrade
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          MAX_POSTS_PER_RUN: 5
          DRY_RUN: false
        run: |
          python gr8_content_bot/main.py upgrade --limit 5 > upgrade.log 2>&1

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v3
        with:
          name: upgrade-logs-${{ github.run_id }}
          path: upgrade.log
