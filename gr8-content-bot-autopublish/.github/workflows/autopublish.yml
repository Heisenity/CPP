name: Autopublish

on:
  workflow_dispatch:        # Enables manual run button
  schedule:
    - cron: "30 21 * * *"   # Runs nightly ~03:00 IST

jobs:
  upgrade-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run content upgrade
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          MAX_POSTS_PER_RUN: ${{ secrets.MAX_POSTS_PER_RUN }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
        run: |
          python gr8_content_bot/pipeline.py upgrade --limit ${MAX_POSTS_PER_RUN:-5}

      - name: Upload logs as artifact
        uses: actions/upload-artifact@v3
        with:
          name: upgrade-logs-${{ github.run_id }}
          path: upgrade.log
